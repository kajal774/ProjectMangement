spring:
  datasource:
    url: jdbc:h2:mem:teamflow-test;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect

jwt:
  secret: test-only-secret-key-not-for-production-use-1234567890
  expiration-ms: 3600000

app:
  cors:
    allowed-origin: http://localhost:5173
