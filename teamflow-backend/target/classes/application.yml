server:
  port: 8080

spring:
  datasource:
    # Reads from environment variables if set, otherwise falls back to
    # the local defaults on the right of the colon — so this works
    # out of the box with the docker-compose.yml included in this
    # project without any extra setup.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/teamflow}
    username: ${DB_USERNAME:teamflow}
    password: ${DB_PASSWORD:teamflow}
  jpa:
    hibernate:
      # update = Hibernate creates/adjusts tables to match the @Entity
      # classes automatically. Convenient for a prototype; a real
      # project would switch to a migration tool (Flyway/Liquibase)
      # and set this to `validate` instead — see the README.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

jwt:
  # A random 256-bit+ secret is required for HS256 signing. This
  # default is fine for local dev only — always override JWT_SECRET
  # in any real deployment.
  secret: ${JWT_SECRET:this-is-a-local-dev-secret-key-change-it-before-deploying-1234}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
